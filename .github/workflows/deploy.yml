name: Terraform – ECS Blue/Green Deployment

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: strapi   # change if needed

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------
      # Checkout
      # ----------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------
      # AWS Auth
      # ----------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------
      # Terraform Setup
      # ----------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -reconfigure

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

      # ----------------------------
      # Fetch Latest Task Definition
      # ----------------------------
      - name: Get latest ECS Task Definition ARN
        id: taskdef
        run: |
          TASK_DEF_ARN=$(aws ecs describe-task-definition \
            --task-definition $PROJECT_NAME-task \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)
          echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> $GITHUB_ENV

      # ----------------------------
      # Replace TaskDefinition in AppSpec
      # ----------------------------
      - name: Inject Task Definition into AppSpec
        run: |
          sed -i "s|<TASK_DEFINITION_ARN>|${TASK_DEF_ARN}|g" appspec.yaml
          cat appspec.yaml

      # ----------------------------
      # Trigger CodeDeploy (Blue-Green)
      # ----------------------------
      - name: Trigger CodeDeploy Deployment
        run: |
          aws deploy create-deployment \
            --application-name $PROJECT_NAME-codedeploy \
            --deployment-group-name $PROJECT_NAME-dg \
            --revision revisionType=AppSpecContent,appSpecContent="{file://appspec.yaml}"

