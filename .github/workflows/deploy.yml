name: Terraform – ECS Blue/Green Deployment

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: strapi
  ECR_REPO: strapi-repo
  AWS_ACCOUNT_ID: 301782007642   # <-- your account id

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------
      # Checkout
      # ----------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------
      # AWS Authentication
      # ----------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------
      # Login to Amazon ECR
      # ----------------------------
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION \
          | docker login --username AWS --password-stdin \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

      # ----------------------------
      # Build Docker Image
      # ----------------------------
      - name: Build Docker image
        run: |
          docker build -t $ECR_REPO:latest .

      # ----------------------------
      # Tag Docker Image for ECR
      # ----------------------------
      - name: Tag Docker image
        run: |
          docker tag $ECR_REPO:latest \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:latest

      # ----------------------------
      # Push Docker Image to ECR
      # ----------------------------
      - name: Push Docker image to ECR
        run: |
          docker push \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:latest

      # ----------------------------
      # Terraform Setup
      # ----------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -reconfigure

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

      # ----------------------------
      # Get latest ECS Task Definition ARN
      # ----------------------------
      - name: Get latest ECS Task Definition ARN
        run: |
          TASK_DEF_ARN=$(aws ecs describe-task-definition \
            --task-definition $PROJECT_NAME-task \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)
          echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> $GITHUB_ENV

      # ----------------------------
      # Inject Task Definition into AppSpec
      # ----------------------------
      - name: Inject Task Definition into AppSpec
        run: |
          sed -i "s|<TASK_DEFINITION_ARN>|${TASK_DEF_ARN}|g" appspec.yaml
          echo "Updated AppSpec:"
          cat appspec.yaml

      # ----------------------------
      # Trigger CodeDeploy (Blue-Green)
      # ----------------------------
      - name: Trigger CodeDeploy Deployment
        run: |
          cat > revision.json <<EOF
          {
            "revisionType": "AppSpecContent",
            "appSpecContent": {
              "content": "$(sed 's/"/\\"/g' appspec.yaml | tr -d '\n')"
            }
          }
          EOF

          aws deploy create-deployment \
            --application-name $PROJECT_NAME-codedeploy \
            --deployment-group-name $PROJECT_NAME-dg \
            --revision file://revision.json

